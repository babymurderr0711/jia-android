name: Build Jia Godot Android APK

on:
  push:
    branches: [godot-main]
    paths:
      - "godot/**"
      - ".github/workflows/build-godot-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot export templates and Android tools
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Validate project scripts
        run: godot --headless --path godot --editor --quit
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path godot --export-debug "Android" build/Jia-Place-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jia-Place-Godot-Android-APK
          path: build/Jia-Place-debug.apk
          if-no-files-found: error
          retention-days: 14
