name: Build Jia Godot Android APK

on:
  workflow_dispatch:
  push:
    branches: [godot-main]
    paths:
      - "godot/**"
      - ".github/workflows/build-godot-apk.yml"

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android export dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_source.zip"

          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;23.2.8568313" "cmake;3.10.2.4988404"
          test -d "${ANDROID_HOME:-/usr/lib/android-sdk}/platforms/android-33"
          test -d "${ANDROID_HOME:-/usr/lib/android-sdk}/build-tools/33.0.2"
          test -d "${ANDROID_HOME:-/usr/lib/android-sdk}/ndk/23.2.8568313"
          test -d "${ANDROID_HOME:-/usr/lib/android-sdk}/cmake/3.10.2.4988404"

          JAVA_BIN="$(readlink -f "$(command -v java)")"
          JAVA_HOME_DIR="$(dirname "$(dirname "$JAVA_BIN")")"
          ANDROID_SDK_DIR="${ANDROID_HOME:-/usr/lib/android-sdk}"
          export ANDROID_HOME="$ANDROID_SDK_DIR"
          export ANDROID_SDK_ROOT="$ANDROID_SDK_DIR"
          export JAVA_HOME="$JAVA_HOME_DIR"
          test -x "$ANDROID_SDK_DIR/platform-tools/adb"
          test -f "$ANDROID_SDK_DIR/platforms/android-33/android.jar"
          test -x "$ANDROID_SDK_DIR/build-tools/33.0.2/zipalign"
          test -x "$ANDROID_SDK_DIR/build-tools/33.0.2/apksigner"
          test -x "$JAVA_HOME_DIR/bin/javac"
          echo "Resolved Android SDK: $ANDROID_SDK_DIR"
          echo "Resolved Java home: $JAVA_HOME_DIR"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_DIR"
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Install project Android Gradle build template
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path godot --install-android-build-template
          test -s godot/android/build/build.gradle
          test -s godot/android/build/settings.gradle
          test -d godot/android/build/gradle

      - name: Validate project scripts and Android preset
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/lib/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "Android SDK contents:"
          ls -la "$ANDROID_HOME"
          echo "Godot editor settings:"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          godot --headless --path godot --editor --quit --verbose
          godot --headless --path godot --quit-after 3
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --headless --path godot --verbose --export-debug "Android" /tmp/Jia-Place-validation.apk
          test -s /tmp/Jia-Place-validation.apk

      - name: Export Android APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --verbose --headless --path godot --export-debug "Android" "$PWD/build/Jia-Place-debug.apk"
          test -s build/Jia-Place-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jia-Place-Godot-Android-APK
          path: build/Jia-Place-debug.apk
          if-no-files-found: error
          retention-days: 14
