name: Validate Jia Godot project

on:
  push:
    branches: [godot-main]
    paths:
      - "godot/**"
      - ".github/workflows/validate-godot.yml"
  pull_request:
    branches: [godot-main]
    paths:
      - "godot/**"

concurrency:
  group: validate-godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path godot --editor --quit
          godot --headless --path godot --quit-after 3
