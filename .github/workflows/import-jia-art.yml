name: Import approved Jia character artwork
on:
  push:
    branches: [godot-main]
    paths:
      - "godot/prepare_character_art.py"
      - ".github/workflows/import-jia-art.yml"
permissions:
  contents: write
concurrency:
  group: import-jia-art-${{ github.ref }}
  cancel-in-progress: true
jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: godot-main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Download and prepare approved art
        run: python godot/prepare_character_art.py
      - name: Commit generated texture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot/assets/*.png
          git commit -m "Import approved Jia character cutout layers" || true
          for attempt in 1 2 3 4 5; do
            git fetch origin godot-main
            git rebase origin/godot-main
            if git push origin HEAD:godot-main; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not push generated artwork after five retries"
          exit 1
